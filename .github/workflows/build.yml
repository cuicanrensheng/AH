name: Build TV Live APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 赋予执行权限
        run: chmod +x gradlew

      - name: 清理缓存并强制刷新依赖
        run: |
          echo "🧹 清理 Gradle 缓存..."
          rm -rf ~/.gradle/caches/
          ./gradlew clean

      - name: 解码签名证书并注入密钥
        run: |
          echo "🔑 正在解码签名证书..."
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore

          echo "🔍 正在静默验证依赖版本..."
          DEPS_OUTPUT=$(./gradlew app:dependencies --configuration releaseCompileClasspath --refresh-dependencies --no-daemon 2>&1 || true)
          
          if echo "$DEPS_OUTPUT" | grep -q "androidx.media3:media3-common:1.7.1"; then
            echo "✅ 版本检查通过：Media3 已锁定为 1.7.1"
          else
            echo "❌ 版本检查失败：未检测到 Media3 1.7.1"
            echo "$DEPS_OUTPUT" | head -n 20
            exit 1
          fi
          
          if echo "$DEPS_OUTPUT" | grep -q "com.google.android.exoplayer"; then
            echo "❌ 安全警告：检测到旧版 ExoPlayer 依赖混入！"
            exit 1
          else
            echo "✅ 安全检查通过：未发现旧版 ExoPlayer 依赖"
          fi

      # ==============================================================
      # 🔧【核心修复 1】自动更新 app/build.gradle 并提交版本号
      # ✅ CI 修复：stash 所有未暂存/未跟踪文件（如 keystore、gradle 临时文件）后再 rebase/push，
      #    避免 "cannot rebase: You have unstaged changes" 错误
      # ==============================================================
      - name: 自动更新 Gradle 版本号并提交回仓库
        run: |
          set -e
          # 统一git用户配置
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          # 🔴【关键修复】禁用 pull.rebase，改用 merge 策略；避免出现 rebase 冲突
          git config --local pull.rebase false
          git config --local pull.ff false

          NEW_VERSION_CODE=${{ github.run_number }}
          BASE_VERSION_NAME="2.0"
          NEW_VERSION_NAME="${BASE_VERSION_NAME}.${NEW_VERSION_CODE}"
          sed -i "s/versionCode [0-9]*/versionCode $NEW_VERSION_CODE/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$NEW_VERSION_NAME\"/" app/build.gradle

          git add app/build.gradle
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto bump versionCode to $NEW_VERSION_CODE [skip ci]"
            # 🔴【关键修复】rebase 前先 stash 所有未暂存改动（包括 app/release.keystore 等未跟踪文件）
            #   否则 git rebase 会直接报错：cannot rebase: You have unstaged changes.
            git stash -u || true
            git fetch origin main
            # 🔴【关键修复 2】即使 stash 了也不用 rebase（过于严格），改用 merge 更稳妥
            git merge --no-edit --no-ff origin/main || true
            git stash pop || true
            # 使用 --force-with-lease 保障安全推送
            git push --force-with-lease origin main || git push origin main
          fi

      # ==============================================================
      # 🔧【核心修复 2】开始打包并生成 update.json 提交到 main 分支
      # ==============================================================
      - name: 开始执行 Release 打包...
        run: |
          echo "🎯 开始执行 Release 打包..."
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -PstorePassword=${{ secrets.STORE_PASSWORD }} \
            -PkeyAlias=${{ secrets.KEY_ALIAS }} \
            -PkeyPassword=${{ secrets.KEY_PASSWORD }}

      - name: 生成并提交 update.json
        run: |
          set -e
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          # 同样禁用 rebase
          git config --local pull.rebase false
          git config --local pull.ff false

          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME=$(grep "versionName" app/build.gradle | head -1 | awk -F'"' '{print $2}')
          DOWNLOAD_URL="https://ghproxy.com/https://github.com/${{ github.repository }}/releases/download/v$VERSION_CODE/app-release.apk"
          if [ -f app/release_notes.txt ]; then
            RELEASE_NOTES=$(cat app/release_notes.txt | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
          else
            RELEASE_NOTES="自动更新版本"
          fi
          cat > update.json << EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "message": "$RELEASE_NOTES",
            "downloadUrl": "$DOWNLOAD_URL"
          }
          EOF

          git add update.json
          if git diff --cached --quiet; then
            echo "No changes to update.json"
          else
            git commit -m "Auto update update.json for release v$VERSION_CODE [skip ci]"
            # 同样的 stash → fetch → merge 流程
            git stash -u || true
            git fetch origin main
            git merge --no-edit --no-ff origin/main || true
            git stash pop || true
            git push --force-with-lease origin main || git push origin main
          fi

      - name: 上传成品 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVLive-直播APP
          path: app/build/outputs/apk/release/*.apk

      - name: 上传更新配置
        uses: actions/upload-artifact@v4
        with:
          name: update-config
          path: update.json

      - name: 创建发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 自动发布 v${{ github.run_number }}
          files: |
            app/build/outputs/apk/release/app-release.apk
            update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
