name: Build TV Live APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 赋予执行权限
        run: chmod +x gradlew

      - name: 清理缓存并强制刷新依赖
        run: |
          echo "🧹 清理 Gradle 缓存..."
          rm -rf ~/.gradle/caches/
          ./gradlew clean

      # ==============================================================
      # 🔑【核心修复】从 GitHub Secrets 解码签名证书，不再依赖本地文件
      # ==============================================================
      - name: 从 Secrets 解码签名证书并验证
        run: |
          echo "🔑 正在从 Secrets 解码签名证书..."
          
          # 1. 直接解码并生成二进制 keystore 文件到 app/ 目录
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore
          
          # 2. 验证文件是否生成成功
          echo "🔍 验证 keystore 文件..."
          ls -la app/release.keystore
          
          # 3. ✅【关键修复】移除 -storetype PKCS12，让 keytool 自动识别格式，避免报错
          keytool -list -keystore app/release.keystore \
            -storepass "${{ secrets.STORE_PASSWORD }}" \
            -v || { echo "❌ keystore 读取失败。请检查 Secrets 中 STORE_PASSWORD 是否为 admin123"; exit 1; }
          
          echo "✅ keystore 验证通过"
          
          # 4. 依赖版本检查和 ExoPlayer 安全验证
          echo "🔍 正在静默验证依赖版本..."
          DEPS_OUTPUT=$(./gradlew app:dependencies --configuration releaseCompileClasspath --refresh-dependencies --no-daemon 2>&1 || true)
          
          if echo "$DEPS_OUTPUT" | grep -q "androidx.media3:media3-common:1.7.1"; then
            echo "✅ 版本检查通过：Media3 已锁定为 1.7.1"
          else
            echo "❌ 版本检查失败：未检测到 Media3 1.7.1"
            echo "$DEPS_OUTPUT" | head -n 20
            exit 1
          fi
          
          if echo "$DEPS_OUTPUT" | grep -q "com.google.android.exoplayer"; then
            echo "❌ 安全警告：检测到旧版 ExoPlayer 依赖混入！"
            exit 1
          else
            echo "✅ 安全检查通过：未发现旧版 ExoPlayer 依赖"
          fi

      # ==============================================================
      # 🔧 自动更新 Gradle 版本号并提交回仓库
      # ==============================================================
      - name: 自动更新 Gradle 版本号并提交回仓库
        run: |
          NEW_VERSION_CODE=${{ github.run_number }}
          
          OLD_VERSION_NAME=$(grep "versionName" app/build.gradle | head -1 | awk -F'"' '{print $2}')
          
          sed -i "s/versionCode [0-9]*/versionCode $NEW_VERSION_CODE/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$OLD_VERSION_NAME.$NEW_VERSION_CODE\"/" app/build.gradle
          
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add app/build.gradle
          git commit -m "Auto bump versionCode to $NEW_VERSION_CODE [skip ci]" || echo "No changes to commit"
          git push

      # ==============================================================
      # 📦 执行 Release 打包（密码从 Secrets 读取）
      # ==============================================================
      - name: 开始执行 Release 打包...
        run: |
          echo "🎯 开始执行 Release 打包..."
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -PstoreFile=app/release.keystore \
            -PstorePassword="${{ secrets.STORE_PASSWORD }}" \
            -PkeyAlias="${{ secrets.KEY_ALIAS }}" \
            -PkeyPassword="${{ secrets.KEY_PASSWORD }}"

      # ==============================================================
      # 📝 生成 update.json 并推送到仓库
      # ==============================================================
      - name: 生成并提交 update.json
        run: |
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME=$(grep "versionName" app/build.gradle | head -1 | awk -F'"' '{print $2}')
          
          DOWNLOAD_URL="https://ghproxy.com/https://github.com/${{ github.repository }}/releases/download/v$VERSION_CODE/app-release.apk"
          if [ -f app/release_notes.txt ]; then
            RELEASE_NOTES=$(cat app/release_notes.txt | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
          else
            RELEASE_NOTES="自动更新版本"
          fi
          cat > update.json << EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "message": "$RELEASE_NOTES",
            "downloadUrl": "$DOWNLOAD_URL"
          }
          EOF
          
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add update.json
          git commit -m "Auto update update.json for release v$VERSION_CODE [skip ci]" || echo "No changes to update.json"
          git push

      # ==============================================================
      # 📤 上传产物与创建 GitHub Release
      # ==============================================================
      - name: 上传成品 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVLive-直播APP
          path: app/build/outputs/apk/release/*.apk

      - name: 上传更新配置
        uses: actions/upload-artifact@v4
        with:
          name: update-config
          path: update.json

      - name: 创建发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 自动发布 v${{ github.run_number }}
          files: |
            app/build/outputs/apk/release/app-release.apk
            update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
