name: Build TV Live APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 赋予 gradlew 初始执行权限
        run: chmod +x gradlew

      - name: 清理缓存并强制刷新依赖
        run: |
          echo "🧹 清理 Gradle 缓存..."
          rm -rf ~/.gradle/caches/
          ./gradlew clean

      - name: 解码签名证书并注入密钥
        run: |
          echo "🔑 正在解码签名证书..."
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore

          echo "🔍 正在静默验证依赖版本..."
          DEPS_OUTPUT=$(./gradlew app:dependencies --configuration releaseCompileClasspath --refresh-dependencies --no-daemon 2>&1 || true)
          
          if echo "$DEPS_OUTPUT" | grep -q "androidx.media3:1.7.1"; then
            echo "✅ 版本检查通过：Media3 已锁定为 1.7.1"
          else
            echo "❌ 版本检查失败：未检测到 Media3 1.7.1"
            echo "$DEPS_OUTPUT" | head -n 20
            exit 1
          fi
          
          if echo "$DEPS_OUTPUT" | grep -q "com.google.android.exoplayer"; then
            echo "❌ 安全警告：检测到旧版 ExoPlayer 依赖混入！"
            exit 1
          else
            echo "✅ 安全检查通过：未发现旧版 ExoPlayer 依赖"
          fi

      - name: 自动更新 Gradle 版本号（仅本地修改，暂不推送）
        run: |
          set -e
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git config --local pull.rebase false
          git config --local pull.ff false

          NEW_VERSION_CODE=${{ github.run_number }}
          BASE_VERSION_NAME="2.0"
          NEW_VERSION_NAME="${BASE_VERSION_NAME}.${NEW_VERSION_CODE}"
          sed -i "s/versionCode [0-9]*/versionCode $NEW_VERSION_CODE/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$NEW_VERSION_NAME\"/" app/build.gradle

      - name: 开始执行 Release 双ABI打包
        run: |
          echo "🎯 开始执行 Release 分包打包..."
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -PstorePassword=${{ secrets.STORE_PASSWORD }} \
            -PkeyAlias=${{ secrets.KEY_ALIAS }} \
            -PkeyPassword=${{ secrets.KEY_PASSWORD }}

      - name: 上传Mapping文件夹（崩溃混淆还原）
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mapping-release
          path: app/build/outputs/mapping/release/
          retention-days: 7

      - name: 生成双架构下载地址 update.json
        run: |
          set -e
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME=$(grep "versionName" app/build.gradle | head -1 | awk -F'"' '{print $2}')
          # 替换可用ghfast加速域名，废弃被墙ghproxy.com
          BASE_URL="https://ghfast.top/https://github.com/${{ github.repository }}/releases/download/v$VERSION_CODE"
          URL_V7A="$BASE_URL/app-armeabi-v7a-release.apk"
          URL_V8A="$BASE_URL/app-arm64-v8a-release.apk"

          if [ -f app/release_notes.txt ]; then
            RELEASE_NOTES=$(cat app/release_notes.txt | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
          else
            RELEASE_NOTES="自动更新版本"
          fi
          cat > update.json << EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "message": "$RELEASE_NOTES",
            "forceUpdate": false,
            "abi_download": {
              "armeabi-v7a": "$URL_V7A",
              "arm64-v8a": "$URL_V8A"
            }
          }
          EOF

      # CI自动打包自定义完整源码包
      - name: 打包项目源码 release-source-v${{ github.run_number }}
        run: |
          VERSION_CODE=${{ github.run_number }}
          zip -r source-v${VERSION_CODE}.zip . \
            -x ".git/*" \
            -x "app/build/*" \
            -x "~/.gradle/*" \
            -x "app/release.keystore"

      # 调试：打印打包产物确认文件存在
      - name: 调试输出APK与源码包列表
        run: |
          ls -la app/build/outputs/apk/release/
          ls -la *.zip update.json

      # 一次性上传双APK、update.json、自定义源码包到Release页面
      - name: 创建发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 自动发布 v${{ github.run_number }}
          files: |
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk
            app/build/outputs/apk/release/app-arm64-v8a-release.apk
            update.json
            source-v${{ github.run_number }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 备份所有APK到Workflow工件
      - name: 上传全部成品APK
        uses: actions/upload-artifact@v4
        with:
          name: TVLive-双架构安装包
          path: app/build/outputs/apk/release/*.apk

      - name: 上传更新配置文件
        uses: actions/upload-artifact@v4
        with:
          name: update-config
          path: update.json

      # 打包发布完成后，再提交版本号、update.json回仓库，无stash不会删除apk
      - name: Git提交版本变更回主分支
        run: |
          set -e
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git config --local pull.rebase false
          git config --local pull.ff false

          git add app/build.gradle update.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto bump version & update.json v${{ github.run_number }} [skip ci]"
            git fetch origin main
            git push origin main || echo "远端版本更新，跳过推送"
          fi
