plugins {
    id 'com.android.application'
}

android {
    namespace "com.tv.live"
    compileSdk 36
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled false
    }
    buildFeatures {
        buildConfig true
    }
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk false
        }
    }
    defaultConfig {
        applicationId "com.tv.live"
        minSdk 21
        targetSdk 36
        versionCode 13
        versionName "2.0.13"
        resConfigs "zh"
        multiDexEnabled false
        buildConfigField "int", "VERSION_CODE", "${versionCode}"
        buildConfigField "String", "VERSION_NAME", "\"${versionName}\""
        ndk {
            debugSymbolLevel 'NONE'
        }
    }
    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword project.findProperty("storePassword")
            keyAlias project.findProperty("keyAlias")
            keyPassword project.findProperty("keyPassword")
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }
    packagingOptions {
        resources {
            pickFirsts += ['META-INF/com.android.tools/proguard/coroutines.pro']
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt',
                         'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt',
                         'META-INF/notice.txt', 'META-INF/ASL2.0', 'META-INF/*.kotlin_module',
                         'META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties',
                         'assets/huya_berry_protocol_license.txt',
                         'assets/huya_berry_third_party_license.html',
                         'assets/webgame/*.html', 'assets/webgame/*.js', 'assets/webgame/*.css',
                         'META-INF/services/*',
                         'META-INF/proguard/*.pro']
        }
        jniLibs {
            useLegacyPackaging false
            pickFirsts += ['lib/arm64-v8a/libhyaudioengine.so', 'lib/armeabi-v7a/libhyaudioengine.so']
        }
    }
    androidResources {
        generateLocaleConfig false
    }
    lint {
        baseline = file("lint-baseline.xml")
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.zxing:core:3.5.1'
    implementation "androidx.media3:media3-exoplayer:1.7.1"
    implementation "androidx.media3:media3-ui:1.7.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.7.1"
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'], exclude: [
            'audioengineencode-1.1.80.aar',
            'audioenginecapture-1.1.80.aar',
            'imagefilter-1.1.80.aar',
            'rtmpupload-1.1.80.aar'
    ])
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            try {
                def currentName = output.outputFileName.get()
                def abiName = currentName.find(/arm64-v8a|armeabi-v7a/)
                if (!abiName) {
                    abiName = variant.name
                }
                def verName = android.defaultConfig.versionName
                def newName = "tv_live_${variant.buildType}_${abiName}_${verName}.apk"
                logger.lifecycle "Renaming APK: ${currentName} -> ${newName}"
                output.outputFileName.set(newName)
            } catch (Exception e) {
                logger.warn "Rename failed for ${variant.name}: ${e.message}"
            }
        }
    }
}

project.afterEvaluate {
    tasks.named('assembleRelease') {
        doLast {
            def outputDir = file("$buildDir/outputs/apk/release")
            if (outputDir.exists()) {
                def abis = ['arm64-v8a', 'armeabi-v7a']
                abis.each { abi ->
                    def pattern = "*-${abi}-release.apk"
                    fileTree(dir: outputDir, include: pattern).each { apk ->
                        def verName = android.defaultConfig.versionName
                        def newName = "tv_live_release_${abi}_${verName}.apk"
                        def newFile = new File(outputDir, newName)
                        if (!apk.name.equals(newName) && !newFile.exists()) {
                            apk.renameTo(newFile)
                            logger.lifecycle "Post-build renamed: ${apk.name} -> ${newName}"
                        }
                    }
                }
            }
        }
    }
}

configurations.all {
    resolutionStrategy {
        force "androidx.media3:media3-common:1.7.1"
        force "androidx.media3:media3-exoplayer:1.7.1"
        force "androidx.media3:media3-ui:1.7.1"
        force "androidx.media3:media3-exoplayer-hls:1.7.1"
        force "androidx.lifecycle:lifecycle-process:2.6.2"
    }
    exclude group: 'com.huya.berry', module: 'sdkplayer'
    exclude group: 'com.huya.berry', module: 'sdklive'
    exclude group: 'com.huya.berry', module: 'sdkcamera'
    exclude group: 'com.huya.berry', module: 'audioengineencode'
    exclude group: 'com.huya.berry', module: 'audioenginecapture'
    exclude group: 'com.huya.berry', module: 'imagefilter'
    exclude group: 'com.huya.berry', module: 'rtmpupload'
    exclude group: 'com.huya.berry', module: 'webrtc-sdk'
    exclude group: 'org.webrtc'
    exclude group: 'com.squareup.picasso'
    exclude group: 'com.github.bumptech.glide'
}

// ====================================================================
// 🔧 NDK SO 符号剥离配置（减小APK体积，需要安装NDK）
// ====================================================================
// 注意：此配置需要NDK支持，如未安装NDK会自动跳过
// 如需使用，请在local.properties中配置ndk.dir指向NDK安装目录
android.applicationVariants.all { variant ->
    if (variant.buildType.name == 'release') {
        variant.outputs.all { output ->
            output.processResources.doLast {
                try {
                    def stripTool = null
                    def ndkDir = null
                    
                    // 尝试获取NDK目录
                    try {
                        ndkDir = android.ndkDirectory
                    } catch (Exception e) {
                        // NDK未安装
                    }
                    
                    if (ndkDir) {
                        def stripPath = "${ndkDir}/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-strip"
                        def stripFile = file(stripPath)
                        if (stripFile.exists()) {
                            stripTool = stripFile.absolutePath
                        }
                    }
                    
                    if (!stripTool) {
                        // 尝试从local.properties查找ndk路径
                        def localProps = file("${rootProject.projectDir}/local.properties")
                        if (localProps.exists()) {
                            def ndkPathLine = localProps.text.readLines().find { it.startsWith('ndk.dir=') }
                            if (ndkPathLine) {
                                def basePath = ndkPathLine.replace('ndk.dir=', '').trim()
                                def ndkDirs = file(basePath).listFiles()
                                if (ndkDirs) {
                                    def latestNdk = ndkDirs.findAll { it.directory }.sort { a, b -> b.name <=> a.name }[0]
                                    if (latestNdk) {
                                        def candidate = "${latestNdk.absolutePath}/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-strip"
                                        if (file(candidate).exists()) {
                                            stripTool = candidate
                                        }
                                    }
                                }
                            }
                        }
                    }
                    
                    if (stripTool) {
                        def abiFolders = ['arm64-v8a', 'armeabi-v7a']
                        abiFolders.each { abi ->
                            def jniLibsFolder = "${buildDir}/intermediates/jniLibs/release/${abi}"
                            fileTree(dir: jniLibsFolder, include: ['*.so']).each { soFile ->
                                try {
                                    exec {
                                        commandLine stripTool, '--strip-debug', soFile.absolutePath
                                    }
                                    logger.lifecycle "Stripped debug symbols: ${soFile.name}"
                                } catch (Exception e) {
                                    logger.warn "Strip failed for ${soFile.name}: ${e.message}"
                                }
                            }
                        }
                    } else {
                        logger.lifecycle "NDK strip tool not found, skipping SO symbol stripping"
                    }
                } catch (Exception e) {
                    logger.lifecycle "SO stripping skipped: ${e.message}"
                }
            }
        }
    }
}
