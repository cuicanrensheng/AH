plugins {
    id 'com.android.application'
}

android {
    namespace "com.tv.live"

    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        buildConfig true
    }

    bundle {
        language {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
    }

    defaultConfig {
        applicationId "com.tv.live"

        minSdk 21
        targetSdk 36

        versionCode 3129
        versionName "2.0.3108.3114.3115.3117.3118.3119.3121.3122.3125.3126.3128.3129"

        resConfigs "zh"

        multiDexEnabled true 

        buildConfigField "int", "VERSION_CODE", "${versionCode}"
        buildConfigField "String", "VERSION_NAME", "\"${versionName}\""

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword project.findProperty("storePassword")
            keyAlias project.findProperty("keyAlias")
            keyPassword project.findProperty("keyPassword")
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }

    packagingOptions {
        resources {
            pickFirsts += ['META-INF/com.android.tools/proguard/coroutines.pro']
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt',
                         'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt',
                         'META-INF/notice.txt', 'META-INF/ASL2.0', 'META-INF/*.kotlin_module',
                         'META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties']
        }
        jniLibs {
            useLegacyPackaging false
        }
    }

    androidResources {
        noCompress ''
        generateLocaleConfig false
    }

    lint {
        baseline = file("lint-baseline.xml")
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    implementation 'androidx.appcompat:appcompat:1.7.0'

    implementation 'com.google.zxing:core:3.5.1'

    implementation "androidx.media3:media3-exoplayer:1.7.1"
    implementation "androidx.media3:media3-ui:1.7.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.7.1"

    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    implementation 'androidx.multidex:multidex:2.0.1'
}

configurations.all {
    resolutionStrategy {
        force "androidx.media3:media3-common:1.7.1"
        force "androidx.media3:media3-exoplayer:1.7.1"
        force "androidx.media3:media3-ui:1.7.1"
        force "androidx.media3:media3-exoplayer-hls:1.7.1"
    }
}
