plugins {
    id 'com.android.application'
}

android {
    namespace "com.tv.live"
    compileSdk 36
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    buildFeatures {
        buildConfig true
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    splits {
        abi {
            enable true
            reset()
            // ⚠️ 已剔除 x86 / x86_64：仅保留 ARM 架构（覆盖 Android 5.1.1~最新版真机/主流模拟器）
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk false
        }
    }
    defaultConfig {
        applicationId "com.tv.live"
        minSdk 21
        targetSdk 36
        versionCode 173
        versionName "2.0.173"
        resConfigs "zh"
        multiDexEnabled true
        // 关键：开启 vector 支持库。否则 AppCompat 在启动加载 <vector> 资源（adaptive icon/
        // windowBackground/windowSplashscreen）时会抛 IllegalStateException（卡启动界面），
        // 且 R8 缩减 + aapt2 资源混淆后易触发。开启后由 androidx.vectordrawable 兜底解压 PNG。
        vectorDrawables {
            useSupportLibrary true
        }
        buildConfigField "int", "VERSION_CODE", "${versionCode}"
        buildConfigField "String", "VERSION_NAME", "\"${versionName}\""
        ndkVersion '25.2.9519653'
        ndk {
            // ⚠️ 注意：splits.abi 已按架构分包，AGP 不允许同时设置 ndk.abiFilters
            // abiFilters 在此留空，ABI 过滤完全由 splits.abi 控制
            debugSymbolLevel 'NONE'
        }
    }
    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword project.findProperty("storePassword")
            keyAlias project.findProperty("keyAlias")
            keyPassword project.findProperty("keyPassword")
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            // 正式版移除 SourceFile 和 LineNumberTable，增加反编译难度
            buildConfigField "boolean", "IS_DEBUG", "false"
        }
        debug {
            minifyEnabled false
            shrinkResources false
            buildConfigField "boolean", "IS_DEBUG", "true"
        }
    }
    packagingOptions {
        resources {
            pickFirsts += ['META-INF/com.android.tools/proguard/coroutines.pro']
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt',
                         'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt',
                         'META-INF/notice.txt', 'META-INF/ASL2.0', 'META-INF/*.kotlin_module',
                         'META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties',
                         'assets/huya_berry_protocol_license.txt',
                         'assets/huya_berry_third_party_license.html',
                         'assets/webgame/*.html', 'assets/webgame/*.js', 'assets/webgame/*.css',
                         'META-INF/services/*',
                         'META-INF/proguard/*.pro',
                         'META-INF/*.version',
                         'META-INF/versions/**',
                         '**/*.kotlin_builtins',
                         '**/*.kotlin_metadata',
                         '**/*.proto',
                         '**/*.aidl',
                         'DebugProbesKt.bin']
        }
        jniLibs {
            // true = SO 以 deflate 压缩进 APK（安装时由系统解压到 /data/app/.../lib/）
            // ⚠️ 必须用 true：extractNativeLibs=false（useLegacyPackaging=false）是 API 23+ 特性，
            // 在 Android 5.x (API 22) 上 so 无法正确从 APK 映射加载 → libmarsstn.so JNI 符号注册失败
            // → java.lang.UnsatisfiedLinkError: No implementation found for StnLogic.startTask_2（实测崩溃）
            useLegacyPackaging true
            pickFirsts += [
                    'lib/arm64-v8a/libhyaudioengine.so',
                    'lib/armeabi-v7a/libhyaudioengine.so',
                    'lib/arm64-v8a/libc++_shared.so',
                    'lib/armeabi-v7a/libc++_shared.so',
                    'lib/x86/libc++_shared.so',
                    'lib/x86_64/libc++_shared.so'
            ]
            // 安全网：排除 libBugly_Native.so（Bugly 普通版引用已移除，实验）。
            // 该 so 内置崩溃诊断会在上报路径执行 logcat（Android 13+/小米 ROM 触发
            // "允许访问所有设备日志"系统弹窗）；保留此排除以防 SDK aar 传递引入。
            excludes += ['**/libBugly_Native.so']
            // ⚠️ 勿剔除 libmarsxlog.so / libstlport_shared.so（xlog 链路）！
            // 实测剔除后：mars.Mars.loadDefaultMarsLibrary 加载 libmarsxlog.so 失败
            // → 整个 mars 网络栈（StnLogic/HySignal/MtpMarsTransporter）不可用，取流失败。
            // libc++_shared.so 同样不可剔除（libmmkv.so + libmarsstn.so 的 DT_NEEDED 硬依赖）。
            // 这两条链是 SDK init 的强制加载项（ArkValue.initLog → Xlog.<clinit>）。
        }
    }
    androidResources {
        generateLocaleConfig false
    }
    lint {
        baseline = file("lint-baseline.xml")
        abortOnError false
        checkReleaseBuilds false
    }
}

// ============== 🔒 dpt-shell 加固（替换 360）==============
// 工具位置：D:/ASDF/TV Live/dpt-shell/executable（dpt.jar + shell-files，v2.19.1 预构建）
// 说明：assembleRelease 后对每个 release APK 执行 dpt 加固
//       （dex 加密、so .bitcode 段加密、反射 clinit 注入、反调试/Frida/CRC 检测），
//       并用 dpt-config.json（release.keystore）自动重签 V1+V2+V3。
// 用法：gradlew releaseJiaGu（一键编译正式版+加固），或 gradlew dptJiaGu（仅加固现有产物）
def dptExecutableDir = "${rootDir}/jiagu/dpt"
def dptJarFile = file("${dptExecutableDir}/dpt.jar")
def dptConfigFile = file("${rootDir}/dpt-config.json")

task dptJiaGu {
    group = 'security'
    description = '对 release APK 进行 dpt-shell 加固并自动重签（V1+V2+V3）'
    dependsOn 'assembleRelease'
    doLast {
        if (!dptJarFile.exists()) {
            throw new GradleException("[dpt] 未找到 ${dptJarFile.absolutePath}，请先部署 dpt-shell executable 目录")
        }
        if (!dptConfigFile.exists()) {
            throw new GradleException("[dpt] 未找到 ${dptConfigFile.absolutePath}（签名配置）")
        }
        def apkDir = file("${buildDir}/outputs/apk/release")
        def outDir = file("${buildDir}/outputs/apk/release/dpt")
        outDir.mkdirs()
        def javaBin = new File(System.getProperty('java.home'), 'bin/java.exe')
        apkDir.eachFileMatch(~/.*\.apk/) { apk ->
            if (apk.name.contains('-unsigned')) return
            logger.lifecycle "[dpt] 加固: ${apk.name}"
            def proc = [javaBin.absolutePath, '-jar', dptJarFile.absolutePath,
                        '-f', apk.absolutePath,
                        '-o', outDir.absolutePath,
                        '-c', dptConfigFile.absolutePath].execute(null, projectDir)
            def outLog = new StringBuilder()
            def errLog = new StringBuilder()
            proc.consumeProcessOutput(outLog, errLog)
            proc.waitFor()
            if (proc.exitValue() == 0) {
                def signed = file("${outDir}/${apk.name.replace('.apk', '_signed.apk')}")
                // 清理中间 unsign 文件
                file("${outDir}/${apk.name.replace('.apk', '_unsign.apk')}").delete()
                logger.lifecycle "[dpt] ✅ 加固完成: ${signed.name} (${(signed.length() / 1024 / 1024).round(1)} MB)"
            } else {
                logger.error "[dpt] ❌ 加固失败: ${apk.name}"
                logger.error errLog.toString()
                throw new GradleException("[dpt] 加固失败: ${apk.name}")
            }
        }
    }
}

// 一键任务：编译正式版 + dpt 加固
task releaseJiaGu {
    group = 'security'
    description = '编译正式版并执行 dpt-shell 加固（推荐入口）'
    dependsOn 'dptJiaGu'
}

// ============== ⛔ 资源名混淆（aapt2 optimize）已停用 ==============
// 【为什么停用】
//   aapt2 optimize --collapse-resource-names 会重排/压缩资源 ID，
//   而 虎牙 SDK（HuyaBerryImpl.initBaseApi）与 AppCompat/vector drawable
//   都是通过**编译期硬编码的资源 ID / getIdentifier()** 访问资源。
//   资源 ID 一变，SDK 内部临时引用全部失效：
//     - 虎牙：NotFoundException: String resource ID #0x0（SDK 失效）
//     - AppCompat/vector：IllegalStateException VectorDrawableCompat（启动崩溃+图标丢）
//   Debug 版（不跑资源混淆）里两者都正常，证实资源混淆是元凶。
// 【结论】反编译保护改用：R8 代码混淆（-keep 类+签名）+ NDK 反调试 + 字符串加密，
//   不再做资源名混淆（会破坏第三方 SDK）。如需资源保护，只能接加固壳。
// ==============
/*
project.afterEvaluate {
    tasks.matching { it.name == 'assembleRelease' }.configureEach { task ->
        task.doLast {
            def buildTools = android.buildToolsVersion
            def aapt2 = "${android.sdkDirectory}/build-tools/${buildTools}/aapt2"
            def apksigner = "${android.sdkDirectory}/build-tools/${buildTools}/apksigner.bat"
            def zipalign = "${android.sdkDirectory}/build-tools/${buildTools}/zipalign.exe"
            def ks = android.signingConfigs.release.storeFile
            def ksPwd = android.signingConfigs.release.storePassword
            def keyAlias = android.signingConfigs.release.keyAlias
            def keyPwd = android.signingConfigs.release.keyPassword

            def apkDir = file("${buildDir}/outputs/apk/release")
            apkDir.eachFileMatch(~/.*\.apk/) { apk ->
                if (apk.name.contains('-unsigned')) return
                def collapsed = file("${apk.parent}/${apk.name.replace('.apk', '-collapsed.apk')}")
                def aligned   = file("${apk.parent}/${apk.name.replace('.apk', '-aligned.apk')}")
                logger.lifecycle "[ResGuard] aapt2 optimize: ${apk.name}"
                def opt = [aapt2, 'optimize',
                           '--collapse-resource-names',
                           '-o', collapsed.absolutePath,
                           apk.absolutePath].execute()
                opt.waitFor()
                if (opt.exitValue() != 0 || !collapsed.exists()) {
                    logger.warn "[ResGuard] aapt2 optimize FAILED, keep original"
                    return
                }
                def za = [zipalign, '-p', '-f', '4',
                          collapsed.absolutePath,
                          aligned.absolutePath].execute()
                za.waitFor()
                collapsed.delete()
                def sg = [apksigner, 'sign',
                          '--ks', ks.absolutePath,
                          '--ks-pass', "pass:${ksPwd}",
                          '--ks-key-alias', keyAlias,
                          '--key-pass', "pass:${keyPwd}",
                          '--v1-signing-enabled', 'true',
                          '--v2-signing-enabled', 'true',
                          aligned.absolutePath].execute()
                sg.waitFor()
                if (sg.exitValue() == 0) {
                    apk.delete()
                    aligned.renameTo(apk)
                    logger.lifecycle "[ResGuard] OK → ${apk.name} (${apk.length() / 1024} KB, re-signed)"
                } else {
                    logger.warn "[ResGuard] sign FAILED, keep original"
                    aligned.delete()
                }
            }
        }
    }
}
*/

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.zxing:core:3.5.1'
    implementation "androidx.media3:media3-exoplayer:1.7.1"
    implementation "androidx.media3:media3-ui:1.7.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.7.1"
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'], exclude: [
            'audioengineencode-1.1.80.aar',
            'audioenginecapture-1.1.80.aar',
            'imagefilter-1.1.80.aar',
            'rtmpupload-1.1.80.aar',
            // ⚠️ 以下 8 个 AAR 为「开播推流/云游戏」模块（com/huya/force + com/huya/mtp/hycloudgame），
            // 本应用为纯观看场景，不调用开播功能。已验证（2026-08-28，正确 ZIP 解压 + 类级/子串级
            // 双向引用扫描 + HuyaBerryImpl.init 字节码检查 + manifest 组件检查）：
            //   · 保留侧 34 个模块对它们零引用；
            //   · HuyaBerryImpl.init 字节码不引用；
            //   · 各自 so 无外部 System.loadLibrary 点，res 无外部 R 引用。
            // 排除后 SDK 初始化与播放不受影响。
            'audiocapture-1.1.80.aar',
            'audiohardencode-1.1.80.aar',
            'cameracapture-1.1.80.aar',
            'screencapture-1.1.80.aar',
            'videohardencode-1.1.80.aar',
            'client-1.1.80.aar',
            'export-1.1.80.aar',
            'hycloudgame-base-1.9.105-exvolley.aar',
            // utils-1.1.80.aar（2.2MB）为推流引擎工具库（50 类全在 com/huya/force 包：
            // gles/gpuimage/log/collect），同为开播链路，核心 34 模块零引用，一并排除。
            'utils-1.1.80.aar',
            // Bugly 专业版 aar（crashreport-3.0.0 / nativecrashreport-3.7.1）已删除（实验 2026-08-28），
            // 备份于 _backup/。SDK 侧 isOpenBugly(false) 已禁用其初始化，删除不影响编译与运行。
            // ⚠️ statistics/livestatistics/apm 必须保留打包：SDK init 链路强依赖这些类，
            // 排除会导致 NoClassDefFoundError 使 SDK 失效。改为由 HuyaCacheGovernor
            // 反射关闭 isOpenStat/isOpenAnalytics/isOpenApm 等开关，运行时禁用其功能。
            // NSEasy 完整实现由 hynswrapper-1.9.105-exvolley.aar 提供，
            // classes.jar（仅 NSEasy+BuildConfig 的 stub）会造成重复类冲突。
            'classes.jar'
    ])
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            try {
                def currentName = output.outputFileName.get()
                def abiName = currentName.find(/arm64-v8a|armeabi-v7a/)
                if (!abiName) {
                    abiName = variant.name
                }
                def verName = android.defaultConfig.versionName
                def newName = "tv_live_${variant.buildType}_${abiName}_${verName}.apk"
                logger.lifecycle "Renaming APK: ${currentName} -> ${newName}"
                output.outputFileName.set(newName)
            } catch (Exception e) {
                logger.warn "Rename failed for ${variant.name}: ${e.message}"
            }
        }
    }
}

project.afterEvaluate {
    tasks.named('assembleRelease') {
        doLast {
            def outputDir = file("$buildDir/outputs/apk/release")
            if (outputDir.exists()) {
                def abis = ['arm64-v8a', 'armeabi-v7a']
                abis.each { abi ->
                    def pattern = "*-${abi}-release.apk"
                    fileTree(dir: outputDir, include: pattern).each { apk ->
                        def verName = android.defaultConfig.versionName
                        def newName = "tv_live_release_${abi}_${verName}.apk"
                        def newFile = new File(outputDir, newName)
                        if (!apk.name.equals(newName) && !newFile.exists()) {
                            apk.renameTo(newFile)
                            logger.lifecycle "Post-build renamed: ${apk.name} -> ${newName}"
                        }
                    }
                }
            }
        }
    }
}

configurations.all {
    resolutionStrategy {
        force "androidx.media3:media3-common:1.7.1"
        force "androidx.media3:media3-exoplayer:1.7.1"
        force "androidx.media3:media3-ui:1.7.1"
        force "androidx.media3:media3-exoplayer-hls:1.7.1"
        force "androidx.lifecycle:lifecycle-process:2.6.2"
    }
    exclude group: 'com.huya.berry', module: 'sdkplayer'
    exclude group: 'com.huya.berry', module: 'sdklive'
    exclude group: 'com.huya.berry', module: 'sdkcamera'
    exclude group: 'com.huya.berry', module: 'audioengineencode'
    exclude group: 'com.huya.berry', module: 'audioenginecapture'
    exclude group: 'com.huya.berry', module: 'imagefilter'
    exclude group: 'com.huya.berry', module: 'rtmpupload'
    exclude group: 'com.huya.berry', module: 'webrtc-sdk'
    exclude group: 'org.webrtc'
    exclude group: 'com.squareup.picasso'
    exclude group: 'com.github.bumptech.glide'
}

