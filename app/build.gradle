plugins {
    id 'com.android.application'
}

android {
    namespace "com.tv.live"

    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests {
            // 单元测试中 Log/Toast/TextUtils 等 Android 类未 mock 时，返回默认值而不是抛异常
            returnDefaultValues = true
        }
    }

    bundle {
        language {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
    }

    // ABI 拆分：每个 APK 只含一个架构的 SO 文件，大幅减小体积
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            // Debug 构建额外生成 universal APK，方便在 LDPlayer(x86_64+houdini转译) 上测试
            universalApk !gradle.startParameter.taskNames.any{ it.toLowerCase().contains('release') }
        }
    }

    defaultConfig {
        applicationId "com.tv.live"

        minSdk 21
        targetSdk 36

        versionCode 2365
        versionName "2.0.2365"

        resConfigs "zh"

        multiDexEnabled true

        buildConfigField "int", "VERSION_CODE", "${versionCode}"
        buildConfigField "String", "VERSION_NAME", "\"${versionName}\""

        // 指定 NDK 版本与本地一致，确保 SO 符号剥离正常工作
        ndkVersion '25.2.9519653'
        ndk {
            debugSymbolLevel 'NONE'  // Release 版本不保留调试符号
        }
    }

    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword project.findProperty("storePassword")
            keyAlias project.findProperty("keyAlias")
            keyPassword project.findProperty("keyPassword")
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            crunchPngs true
            zipAlignEnabled true

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }

    packagingOptions {
        resources {
            pickFirsts += ['META-INF/com.android.tools/proguard/coroutines.pro']
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt',
                         'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt',
                         'META-INF/notice.txt', 'META-INF/ASL2.0', 'META-INF/*.kotlin_module',
                         'META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties',
                         // 排除 SDK 中不需要的资源文件
                         'assets/huya_berry_protocol_license.txt',
                         'assets/huya_berry_third_party_license.html',
                         'assets/webgame/*.html', 'assets/webgame/*.js', 'assets/webgame/*.css',
                         'META-INF/services/*',
                         'META-INF/proguard/*.pro']
        }
        jniLibs {
            // false: SO 不压缩存储，安装时 mmap 直接使用（零解压开销，节省设备存储）
            // true:  SO 压缩存储，安装时解压到设备（下载小但设备占用翻倍）
            useLegacyPackaging false
            pickFirsts += ['lib/arm64-v8a/libhyaudioengine.so', 'lib/armeabi-v7a/libhyaudioengine.so']
        }
    }

    androidResources {
        generateLocaleConfig false
    }

    lint {
        baseline = file("lint-baseline.xml")
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'

    implementation 'com.google.zxing:core:3.5.1'

    implementation "androidx.media3:media3-exoplayer:1.7.1"
    implementation "androidx.media3:media3-ui:1.7.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.7.1"

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    implementation 'com.google.code.gson:gson:2.10.1'

    // 虎牙 Berry SDK（本地 AAR）
    // 第一类：纯推流模块（直播观看完全不需要）
    // 第二类：SDK 核心 30+ AAR/JAR classes.jar 扫描 FQCN 引用 = 0 的"确定未使用"组件
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'], exclude: [
            // 推流相关（上次崩排除没问题）
            'audioengineencode-*.aar',
            'audioenginecapture-*.aar',
            'imagefilter-*.aar',
            'rtmpupload-*.aar',
            // 通用第三方无主依赖（libs 没有 retrofit 所以 adapter-rxjava2 必然废）+ 旧下载/缓存实现（ExoPlayer 自带）
            'adapter-rxjava2-2.4.0.jar',
            'multithreaddownload-1.2.174-sceneform-hotfixsdk13.jar',
            'disklrucache-2.0.2.jar',
            // ====== 以下来自「SDK 内部 classes.jar 字符串扫描 = 0 处引用」的可安全排除候选 ======
            // 已证实不可排除：mtp-api、wup、hyhttpdns、monitor、rxandroid
            //
            // 🅱【2026-08-17 撤回瘦身】hyquic / hysignal-quic 恢复打包：
            //   虽然单个 FQCN 扫描 import 数为 0，但 HySignalWrapper.init 在运行期会
            //   触发 Mars STN 信令层的 `StnLogic$ICallBack` 硬解析，NoClassDefFoundError 级联
            //   导致 HuyaBerry.init 整体失败 → sInitOk=false → UI 提示"虎牙SDK不可用"。
            //   为了让 SDK 恢复可用，恢复这两个 AAR（体积 +5.56 MB，回到 24.43 MB 基线）。
            // 'hyquic-*.aar',
            // 'hysignal-quic-*.aar',
            'smantifraud-*.jar'
    ])

    // 单元测试
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.mockito:mockito-inline:5.2.0'

    // ====================================================================
    // ⭐【2026-08-17 SDK 内部日志/崩溃开关 - 编译期直接调用（全部接入，无反射）】
    //  运行期已经通过 fileTree(libs) 把同名 AAR 打包进 APK 了，这里 compileOnly 只给 javac
    //  提供类签名，让 HuyaSDKParser 能直接 import。
    //  使用 D:\编程\2\222\1\sdk_scan\ 已解压的 jar 版（= aar/classes.jar），避免
    //  compileOnly 对 aar 的限制。
    //  ⚠️ 以下依赖文件不存在，已暂时注释掉。相关功能在 HuyaSDKParser 中已降级处理。
    // ====================================================================
    // ① Mars Xlog（与 android.util.Log 同名，代码中必须写全限定名 com.tencent.mars.xlog.Log.xxx）
    // compileOnly files("D:/编程/2/222/1/sdk_scan/xlog-1.0.78.jar")
    // ② Bugly CrashReport / Bugly
    // compileOnly files("D:/编程/2/222/1/sdk_scan/crashreport-3.0.0.jar")
    // ③ Huya ForceLog（分界标记 + SDK 初始化前后的强打点）
    // compileOnly files("D:/编程/2/222/1/sdk_scan/utils-1.1.80.jar")
    // ④ HuyaBerryImpl.initLog / com.huya.berry.client.CrashService（SDK 核心类）
    // compileOnly files("D:/编程/2/222/1/sdk_scan/sdkclient-release.jar")
    // ⑤ com.duowan.auk.ArkValue.setDebuggable / com.duowan.auk.util.L.setSysLogEnabled/setLogLevel
    // compileOnly files("D:/编程/2/222/1/sdk_scan/common-base-api-sdk-14.jar")
    // ⑥ com.huya.berry.gamesdk.crash.ICrashService 接口
    // compileOnly files("D:/编程/2/222/1/sdk_scan/common-gamesdk-release.jar")
    // ⑦ com.huya.live.service.ServiceCenter.getService(Class) — 用于获取 ICrashService 实例
    // compileOnly files("D:/编程/2/222/1/sdk_scan/common-base-componentbase-sdk-14.jar")
    // ⑧ com.duowan.ark.ArkValue.forceCloseDebuggable — sdkplayer 内部的调试开关
    // compileOnly files("D:/编程/2/222/1/sdk_scan/sdkplayer-impl-release.jar")
    // ⑨ 补充 common-gamesdk-module：SdkProperties / ServiceCenter 可能的注册点
    // compileOnly files("D:/编程/2/222/1/sdk_scan/common-gamesdk-module-release.jar")

    // Core Library Desugaring：让 minSdk 21 能使用 Java 8/24 API (Map.getOrDefault, List.sort 等)
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

configurations.all {
    resolutionStrategy {
        force "androidx.media3:media3-common:1.7.1"
        force "androidx.media3:media3-exoplayer:1.7.1"
        force "androidx.media3:media3-ui:1.7.1"
        force "androidx.media3:media3-exoplayer-hls:1.7.1"
        // 虎牙 SDK 内部打包了旧版 AndroidX 组件，强制使用项目版本
        force "androidx.lifecycle:lifecycle-process:2.6.2"
    }
    // 排除不需要的 SDK 传递依赖（只排除推流相关，SDK 初始化需要的模块不排除）
    exclude group: 'com.huya.berry', module: 'audioengineencode'
    exclude group: 'com.huya.berry', module: 'audioenginecapture'
    exclude group: 'com.huya.berry', module: 'imagefilter'
    exclude group: 'com.huya.berry', module: 'rtmpupload'
    exclude group: 'com.squareup.picasso'
    exclude group: 'com.github.bumptech.glide'

    // ====================================================================
    // 🟢 排除确定安全的 AndroidX 传递依赖
    //    - core-ktx：Kotlin 扩展函数，本项目是纯 Java，100% 未使用
    //    - 其他 AndroidX 传递库（fragment/drawerlayout/recyclerview 等）与 appcompat 强耦合，
    //      R8/shrinkResources 已能在字节码层面裁剪未使用类，直接 exclude 容易引发编译时超类缺失
    // ====================================================================
    exclude group: 'androidx.core', module: 'core-ktx'
}
