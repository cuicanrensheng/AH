plugins {
    id 'com.android.application'
}

android {
    namespace "com.tv.live"
    compileSdk 36
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    buildFeatures {
        buildConfig true
    }
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk false
        }
    }
    defaultConfig {
        applicationId "com.tv.live"
        minSdk 21
        targetSdk 36
        versionCode 55
        versionName "2.0.55"
        resConfigs "zh"
        multiDexEnabled true
        buildConfigField "int", "VERSION_CODE", "${versionCode}"
        buildConfigField "String", "VERSION_NAME", "\"${versionName}\""
        ndkVersion '25.2.9519653'
        ndk {
            debugSymbolLevel 'NONE'
        }
    }
    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword project.findProperty("storePassword")
            keyAlias project.findProperty("keyAlias")
            keyPassword project.findProperty("keyPassword")
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }
    packagingOptions {
        resources {
            pickFirsts += ['META-INF/com.android.tools/proguard/coroutines.pro']
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt',
                         'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt',
                         'META-INF/notice.txt', 'META-INF/ASL2.0', 'META-INF/*.kotlin_module',
                         'META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties',
                         'assets/huya_berry_protocol_license.txt',
                         'assets/huya_berry_third_party_license.html',
                         'assets/webgame/*.html', 'assets/webgame/*.js', 'assets/webgame/*.css',
                         'META-INF/services/*',
                         'META-INF/proguard/*.pro']
        }
        jniLibs {
            useLegacyPackaging false
            pickFirsts += [
                    'lib/arm64-v8a/libhyaudioengine.so',
                    'lib/armeabi-v7a/libhyaudioengine.so',
                    'lib/arm64-v8a/libc++_shared.so',
                    'lib/armeabi-v7a/libc++_shared.so',
                    'lib/x86/libc++_shared.so',
                    'lib/x86_64/libc++_shared.so'
            ]
        }
    }
    androidResources {
        generateLocaleConfig false
    }
    lint {
        baseline = file("lint-baseline.xml")
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.zxing:core:3.5.1'
    implementation "androidx.media3:media3-exoplayer:1.7.1"
    implementation "androidx.media3:media3-ui:1.7.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.7.1"
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'], exclude: [
            'audioengineencode-1.1.80.aar',
            'audioenginecapture-1.1.80.aar',
            'imagefilter-1.1.80.aar',
            'rtmpupload-1.1.80.aar',
            'media3-ffmpeg-decoder.aar'
    ])
    implementation 'org.jellyfin.media3:media3-ffmpeg-decoder:1.6.1+2'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            try {
                def currentName = output.outputFileName.get()
                def abiName = currentName.find(/arm64-v8a|armeabi-v7a/)
                if (!abiName) {
                    abiName = variant.name
                }
                def verName = android.defaultConfig.versionName
                def newName = "tv_live_${variant.buildType}_${abiName}_${verName}.apk"
                logger.lifecycle "Renaming APK: ${currentName} -> ${newName}"
                output.outputFileName.set(newName)
            } catch (Exception e) {
                logger.warn "Rename failed for ${variant.name}: ${e.message}"
            }
        }
    }
}

project.afterEvaluate {
    tasks.named('assembleRelease') {
        doLast {
            def outputDir = file("$buildDir/outputs/apk/release")
            if (outputDir.exists()) {
                def abis = ['arm64-v8a', 'armeabi-v7a']
                abis.each { abi ->
                    def pattern = "*-${abi}-release.apk"
                    fileTree(dir: outputDir, include: pattern).each { apk ->
                        def verName = android.defaultConfig.versionName
                        def newName = "tv_live_release_${abi}_${verName}.apk"
                        def newFile = new File(outputDir, newName)
                        if (!apk.name.equals(newName) && !newFile.exists()) {
                            apk.renameTo(newFile)
                            logger.lifecycle "Post-build renamed: ${apk.name} -> ${newName}"
                        }
                    }
                }
            }
        }
    }
}

configurations.all {
    resolutionStrategy {
        force "androidx.media3:media3-common:1.7.1"
        force "androidx.media3:media3-exoplayer:1.7.1"
        force "androidx.media3:media3-ui:1.7.1"
        force "androidx.media3:media3-exoplayer-hls:1.7.1"
        force "org.jellyfin.media3:media3-ffmpeg-decoder:1.6.1+2"
        force "androidx.lifecycle:lifecycle-process:2.6.2"
    }
    exclude group: 'com.huya.berry', module: 'sdkplayer'
    exclude group: 'com.huya.berry', module: 'sdklive'
    exclude group: 'com.huya.berry', module: 'sdkcamera'
    exclude group: 'com.huya.berry', module: 'audioengineencode'
    exclude group: 'com.huya.berry', module: 'audioenginecapture'
    exclude group: 'com.huya.berry', module: 'imagefilter'
    exclude group: 'com.huya.berry', module: 'rtmpupload'
    exclude group: 'com.huya.berry', module: 'webrtc-sdk'
    exclude group: 'org.webrtc'
    exclude group: 'com.squareup.picasso'
    exclude group: 'com.github.bumptech.glide'
}

// ====================================================================
// 🔧 NDK SO 符号剥离配置（减小APK体积，处理第三方预编译so）
// 注意：
// 1. AGP stripReleaseDebugSymbols仍然会打印"无法剥离xxx库"警告，这是原生任务输出，不能消除；
// 2. 本脚本在内置任务完成后，对输出中间so执行 --strip‑debug；最终APK内so已经剥离调试符号；
// 3. 原始so文件不会被修改，后续上传Bugly符号表，请使用源码侧原始未strip的so/aar；
// 4. ndkVersion固定25.2.9519653，local.properties / SDK ndk目录自动探测llvm‑strip工具
// ====================================================================
android.applicationVariants.all { variant ->
    if (variant.buildType.name == 'release') {
        // release变体内部，此时stripReleaseDebugSymbols任务已经生成
        def stripTask = variant.tasks.named("strip${variant.name.capitalize()}DebugSymbols")
        stripTask.configure { task ->
            task.doLast {
                try {
                    def stripTool = null
                    def ndkDir = null

                    // 跨平台检测：Windows / Linux / macOS
                    def osName = System.getProperty("os.name", "").toLowerCase(Locale.ROOT)
                    def prebuiltDir
                    def exeSuffix = ""
                    if (osName.contains("win")) {
                        prebuiltDir = "windows-x86_64"
                        exeSuffix = ".exe"
                    } else if (osName.contains("mac")) {
                        def osArch = System.getProperty("os.arch", "").toLowerCase(Locale.ROOT)
                        prebuiltDir = (osArch.contains("aarch64") || osArch.contains("arm64")) ? "darwin-aarch64" : "darwin-x86_64"
                    } else {
                        def osArch = System.getProperty("os.arch", "").toLowerCase(Locale.ROOT)
                        prebuiltDir = (osArch.contains("aarch64") || osArch.contains("arm64")) ? "linux-aarch64" : "linux-x86_64"
                    }

                    // 尝试获取 NDK 目录
                    try {
                        ndkDir = android.ndkDirectory
                    } catch (Exception e) {
                        // NDK 未安装，跳过
                    }

                    if (ndkDir) {
                        def candidatePath = "${ndkDir}/toolchains/llvm/prebuilt/${prebuiltDir}/bin/llvm-strip${exeSuffix}"
                        def candidateFile = file(candidatePath)
                        if (candidateFile.exists()) {
                            stripTool = candidateFile.absolutePath
                            logger.lifecycle "NDK strip tool found (AGP NDK): ${stripTool}"
                        } else {
                            // fallback
                            def fallbackDir = osName.contains("win") ? "windows-x86_64" : (osName.contains("mac") ? "darwin-x86_64" : "linux-x86_64")
                            def fallbackPath = "${ndkDir}/toolchains/llvm/prebuilt/${fallbackDir}/bin/llvm-strip${osName.contains('win') ? '.exe' : ''}"
                            def fallbackFile = file(fallbackPath)
                            if (fallbackFile.exists()) {
                                stripTool = fallbackFile.absolutePath
                                logger.lifecycle "NDK strip tool found (fallback ${fallbackDir}): ${stripTool}"
                            }
                        }
                    }

                    if (!stripTool) {
                        // CI环境兜底 ANDROID_HOME / ANDROID_SDK_ROOT
                        def androidHome = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
                        if (!androidHome) {
                            for (def p : ["/usr/local/lib/android/sdk", "$System.env.HOME/Android/Sdk"]) {
                                def d = file(p)
                                if (d.exists() && d.isDirectory()) {
                                    androidHome = p
                                    break
                                }
                            }
                        }
                        if (androidHome) {
                            def ndkVersion = '25.2.9519653'
                            def sdkNdkPath = "${androidHome}/ndk/${ndkVersion}/toolchains/llvm/prebuilt/${prebuiltDir}/bin/llvm-strip${exeSuffix}"
                            def sdkNdkFile = file(sdkNdkPath)
                            if (sdkNdkFile.exists()) {
                                stripTool = sdkNdkFile.absolutePath
                                logger.lifecycle "NDK strip tool found (SDK ndk/${ndkVersion}): ${stripTool}"
                            } else {
                                def bundlePath = "${androidHome}/ndk-bundle/toolchains/llvm/prebuilt/${prebuiltDir}/bin/llvm-strip${exeSuffix}"
                                def bundleFile = file(bundlePath)
                                if (bundleFile.exists()) {
                                    stripTool = bundleFile.absolutePath
                                    logger.lifecycle "NDK strip tool found (SDK ndk‑bundle): ${stripTool}"
                                }
                            }
                        }
                    }

                    if (!stripTool) {
                        // local.properties ndk.dir
                        def localProps = file("${rootProject.projectDir}/local.properties")
                        if (localProps.exists()) {
                            def ndkPathLine = localProps.text.readLines().find { it.startsWith('ndk.dir=') }
                            if (ndkPathLine) {
                                def basePath = ndkPathLine.replace('ndk.dir=', '').trim()
                                def baseDir = file(basePath)
                                File candidate = null
                                if (baseDir.exists() && baseDir.isDirectory()) {
                                    def directPath = "${baseDir.absolutePath}/toolchains/llvm/prebuilt/${prebuiltDir}/bin/llvm-strip${exeSuffix}"
                                    candidate = file(directPath)
                                    if (!candidate.exists()) {
                                        def ndkDirs = baseDir.listFiles()
                                        if (ndkDirs) {
                                            def latestNdk = ndkDirs.findAll { it.directory }.sort { a, b -> b.name <=> a.name }[0]
                                            if (latestNdk) {
                                                candidate = file("${latestNdk.absolutePath}/toolchains/llvm/prebuilt/${prebuiltDir}/bin/llvm-strip${exeSuffix}")
                                            }
                                        }
                                    }
                                }
                                if (candidate && candidate.exists()) {
                                    stripTool = candidate.absolutePath
                                    logger.lifecycle "NDK strip tool found (local.properties): ${stripTool}"
                                }
                            }
                        }
                    }

                    if (stripTool) {
                        // 获取该变体strip任务输出目录，完美兼容 abi splits
                        def soOutputDir = task.outputDir.asFile.get()
                        logger.lifecycle "Start strip pre‑build so in dir: ${soOutputDir.absolutePath}"
                        fileTree(dir: soOutputDir, include: ['**/*.so']).each { soFile ->
                            try {
                                exec {
                                    commandLine stripTool, '--strip-debug', soFile.absolutePath
                                }
                                logger.lifecycle "Stripped debug symbols: ${soFile.name}, abi=${soFile.parentFile.name}"
                            } catch (Exception e) {
                                logger.warn "Strip failed for ${soFile.name}: ${e.message}"
                            }
                        }
                    } else {
                        logger.lifecycle "NDK llvm‑strip not found, skip third‑party so debug symbol strip."
                    }
                } catch (Exception e) {
                    logger.error("SO strip task error", e)
                }
            }
        }
    }
}
