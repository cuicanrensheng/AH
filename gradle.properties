android.overridePathCheck=true
storePassword=admin123
keyAlias=myreleasekey
keyPassword=admin123
# 启用AndroidX 必须开启
android.useAndroidX=true
# 允许非ASCII路径（中文路径）
android.overridePathCheck=true
android.enableJetifier=true
# 屏蔽旧ExoPlayer自动转换，避免新旧库冲突降级（现已注释，Media3 1.7+无需屏蔽）
# android.jetifier.ignorelist=com.google.android.exoplayer
# 消除compileSdk36警告
android.suppressUnsupportedCompileSdk=36
# AGP8.7 扩容虚拟机，防止依赖解析OOM
org.gradle.jvmargs=-Xmx4096m
# 并行编译加速
org.gradle.parallel=true
# CI关闭本地构建缓存，不复用旧Media3包
org.gradle.caching=false
# 每次构建强制远程刷新依赖
org.gradle.refreshDependencies=true
# 完整日志方便排查依赖冲突
org.gradle.logging.level=lifecycle
# 启用 R8 全模式优化，进一步缩减体积
android.enableR8.fullMode=true
