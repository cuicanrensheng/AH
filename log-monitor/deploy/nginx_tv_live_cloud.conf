# TV Live 云端日志服务器 - Nginx 配置模板
# 宝塔面板使用指南：
# 1. 登录宝塔面板 -> 网站 -> 添加站点
# 2. 创建后点击站点名 -> 设置 -> 配置文件
# 3. 将下方内容复制到配置文件中
# 4. 替换 your-domain.com 为您的实际域名

server
{
    listen 80;
    server_name your-domain.com;
    index index.html index.htm;
    root /www/wwwroot/tv-live-cloud/public;
    
    # SSL 配置（如使用 HTTPS，请取消注释并配置证书路径）
    # listen 443 ssl http2;
    # ssl_certificate    /www/server/panel/vhost/cert/your-domain.com/fullchain.pem;
    # ssl_certificate_key    /www/server/panel/vhost/cert/your-domain.com/privkey.pem;
    # include /www/server/panel/vhost/cert/your-domain.com/ssl.conf;
    
    # HTTP 强制跳转 HTTPS（可选）
    # if ($server_port !~ 443) {
    #     rewrite ^(/.*)$ https://$host$1 permanent;
    # }
    
    # 反向代理到 Node.js 服务
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 长连接支持
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_connect_timeout 600;
    }
    
    # API 路径缓存控制
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # API 请求不缓存
        proxy_cache off;
    }
    
    # WebSocket 路径特殊处理
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # WebSocket 长连接超时
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
    
    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:8080;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    
    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # 禁止访问 .env 文件
    location ~ /\.env {
        deny all;
    }
    
    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # 上传文件大小限制（单个日志文件不超过 50MB）
    client_max_body_size 50m;
    
    # 日志配置
    access_log /www/wwwlogs/tv-live-cloud-access.log;
    error_log /www/wwwlogs/tv-live-cloud-error.log;
    
    # 性能优化
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    
    # 速率限制（可选，防止恶意请求）
    # limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    # limit_req zone=api burst=50 nodelay;
}
