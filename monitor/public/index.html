<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Live 实时日志监控面板</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 顶栏 -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="logo">TV Live Monitor</span>
      <span class="status-dot" id="wsStatus">●</span>
      <span class="status-text" id="wsStatusText">连接中...</span>
    </div>
    <div class="topbar-center">
      <div class="stat-badge" data-category="crash">
        <span class="stat-label">崩溃</span>
        <span class="stat-value" id="stat-crash">0</span>
      </div>
      <div class="stat-badge" data-category="parse">
        <span class="stat-label">解析</span>
        <span class="stat-value" id="stat-parse">0</span>
      </div>
      <div class="stat-badge" data-category="player">
        <span class="stat-label">播放</span>
        <span class="stat-value" id="stat-player">0</span>
      </div>
      <div class="stat-badge" data-category="source">
        <span class="stat-label">源管理</span>
        <span class="stat-value" id="stat-source">0</span>
      </div>
      <div class="stat-badge" data-category="security">
        <span class="stat-label">安全</span>
        <span class="stat-value" id="stat-security">0</span>
      </div>
      <div class="stat-badge" data-category="system">
        <span class="stat-label">系统</span>
        <span class="stat-value" id="stat-system">0</span>
      </div>
      <div class="stat-badge" data-category="debug">
        <span class="stat-label">调试</span>
        <span class="stat-value" id="stat-debug">0</span>
      </div>
    </div>
    <div class="topbar-right">
      <button class="btn btn-clear" onclick="clearLogs()">清空</button>
      <button class="btn btn-pause" id="pauseBtn" onclick="togglePause()">暂停</button>
      <label class="auto-scroll">
        <input type="checkbox" id="autoScroll" checked> 自动滚动
      </label>
    </div>
  </header>

  <!-- 侧边栏：设备列表 -->
  <aside class="sidebar">
    <h3>设备列表</h3>
    <ul id="deviceList" class="device-list">
      <li class="device-item active" data-serial="__all__" onclick="selectDevice('__all__')">
        <span class="device-icon">📱</span>
        <span class="device-name">全部设备</span>
        <span class="device-log-count" id="device-count-__all__">0</span>
      </li>
    </ul>

    <h3 style="margin-top: 20px;">分类过滤</h3>
    <ul class="filter-list">
      <li class="filter-item active" data-category="all" onclick="selectCategory('all')">
        <span class="filter-color" style="background:#888"></span> 全部
      </li>
      <li class="filter-item" data-category="crash" onclick="selectCategory('crash')">
        <span class="filter-color" style="background:#ff4444"></span> 崩溃
      </li>
      <li class="filter-item" data-category="parse" onclick="selectCategory('parse')">
        <span class="filter-color" style="background:#44aaff"></span> 解析
      </li>
      <li class="filter-item" data-category="player" onclick="selectCategory('player')">
        <span class="filter-color" style="background:#66cc66"></span> 播放
      </li>
      <li class="filter-item" data-category="source" onclick="selectCategory('source')">
        <span class="filter-color" style="background:#ffcc44"></span> 源管理
      </li>
      <li class="filter-item" data-category="security" onclick="selectCategory('security')">
        <span class="filter-color" style="background:#ff8844"></span> 安全
      </li>
      <li class="filter-item" data-category="system" onclick="selectCategory('system')">
        <span class="filter-color" style="background:#9966cc"></span> 系统
      </li>
      <li class="filter-item" data-category="debug" onclick="selectCategory('debug')">
        <span class="filter-color" style="background:#888888"></span> 调试
      </li>
    </ul>

    <h3 style="margin-top: 20px;">级别过滤</h3>
    <ul class="filter-list">
      <li class="filter-item active" data-level="all" onclick="selectLevel('all')">
        <span class="filter-color" style="background:#888"></span> 全部级别
      </li>
      <li class="filter-item" data-level="E" onclick="selectLevel('E')">
        <span class="filter-color" style="background:#ff4444"></span> Error
      </li>
      <li class="filter-item" data-level="W" onclick="selectLevel('W')">
        <span class="filter-color" style="background:#ffcc44"></span> Warn
      </li>
      <li class="filter-item" data-level="I" onclick="selectLevel('I')">
        <span class="filter-color" style="background:#66cc66"></span> Info
      </li>
      <li class="filter-item" data-level="D" onclick="selectLevel('D')">
        <span class="filter-color" style="background:#9999cc"></span> Debug
      </li>
    </ul>

    <h3 style="margin-top: 20px;">网络状态</h3>
    <div id="networkPanel" class="network-panel">
      <div class="network-empty">等待设备连接...</div>
    </div>
  </aside>

  <!-- 主区域：日志列表 -->
  <main class="main">
    <div class="log-toolbar">
      <input type="text" id="searchInput" class="search-input" placeholder="搜索日志内容、TAG..." oninput="filterLogs()">
      <span class="log-count">显示 <span id="visibleCount">0</span> / <span id="totalCount">0</span> 条</span>
    </div>
    <div class="log-container" id="logContainer">
      <div class="log-empty">等待设备连接...</div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
